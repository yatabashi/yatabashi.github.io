<!DOCTYPE html>
<html lang="ja">
    <head>
        <!-- Common settings -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="icon" href="res/favicon.ico">
        <link rel="stylesheet" href="res/font.css">
        <link rel="stylesheet" href="res/color.css">
        <link rel="stylesheet" href="res/style.css">
        <script src="res/script.js"></script>

        <!-- Title -->
        <title>経験値まとめ : 全国一覧図 - yatabashi</title>

        <!-- External files -->
        <link rel="stylesheet" href="res/keikenti-map/style.css">
        <script src="res/keikenti-map/script-application.js" defer></script>
    </head>
    <body>
        <div id="container">
            <object id="map" type="image/svg+xml" data="res/keikenti-map/map.svg"></object>
        </div>

        <!-- panzoom -->
        <script src="https://cdn.jsdelivr.net/npm/panzoom@9.4.4/dist/panzoom.min.js"></script>
        <script>
            const elm = document.getElementById('map');
            panzoom(elm, {
                minZoom: 1,
                maxZoom: 48,
                zoomSpeed: 0.3,
                pinchSpeed: 1,
            });
        </script>
    </body>
</html>
